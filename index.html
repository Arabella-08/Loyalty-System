<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planners By Dounia - Carte de Fidélité</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f7cece 0%, #fae1d4 50%, #f3cbbe 100%);
      padding: 20px;
    }

    .logo-container {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #d4a38f;
      box-shadow: 0 8px 20px rgba(180, 120, 100, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card {
      background: #fcf8f2;
      width: 100%;
      max-width: 480px;
      padding: 2.5rem 2rem;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(150, 90, 70, 0.15);
      text-align: center;
      border: 1px solid rgba(212, 163, 143, 0.3);
      transition: all 0.3s ease;
    }

    .customer-name {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #7a4635;
      margin-bottom: 0.2rem;
    }

    .subtext {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.4rem;
      color: #926352;
      margin-bottom: 1rem;
    }

    .points {
      font-family: 'Playfair Display', serif;
      font-size: 4.8rem;
      font-weight: 700;
      color: #8c513e;
      line-height: 1;
      margin-bottom: 2rem;
    }

    .stages-container {
      position: relative;
      margin: 20px 10px 10px 10px;
    }

    .track-line {
      position: absolute;
      top: 38px;
      left: 15%;
      right: 15%;
      height: 6px;
      background: #e8d5cc;
      z-index: 1;
      border-radius: 10px;
    }

    .track-fill {
      position: absolute;
      top: 38px;
      left: 15%;
      height: 6px;
      background: linear-gradient(90deg, #8a4e3b 0%, #d4a38f 100%);
      z-index: 1;
      border-radius: 10px;
      width: 0%;
      transition: width 0.8s ease-in-out;
    }

    .stages-flex {
      display: flex;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    .stage-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 80px;
    }

    .stage-pts {
      font-size: 0.85rem;
      font-weight: 600;
      color: #926352;
      margin-bottom: 8px;
    }

    .stage-node {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #d4a38f;
      transition: all 0.4s ease;
    }

    .stage-discount {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #7a4635;
      margin-top: 8px;
    }

    .stage-item.active .stage-node {
      background: #8a4e3b;
      border-color: #8a4e3b;
      transform: scale(1.2);
    }

    .stage-item.active .stage-pts, .stage-item.active .stage-discount {
      color: #8a4e3b;
    }

    .nav-box {
      margin-top: 20px;
      background: #ffffff;
      border: 2px solid #d4a38f;
      border-radius: 18px;
      padding: 14px 20px;
      color: #7a4635;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(150, 90, 70, 0.08);
    }

    .nav-box:hover {
      background: #fdf6f0;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(150, 90, 70, 0.15);
    }

    .history-card {
      text-align: left;
    }

    .back-btn {
      background: none;
      border: none;
      color: #8a4e3b;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 15px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .back-btn:hover {
      text-decoration: underline;
    }

    .table-responsive {
      overflow-x: auto;
      margin-top: 20px;
      border-radius: 12px;
      border: 1px solid #e8d5cc;
    }

    .purchases-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      background: #ffffff;
    }

    .purchases-table th {
      background: #f4e3da;
      color: #7a4635;
      padding: 10px 8px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #d4a38f;
      white-space: nowrap;
    }

    .purchases-table td {
      padding: 10px 8px;
      border-bottom: 1px solid #f0e2da;
      color: #5c382b;
      white-space: nowrap;
    }

    .purchases-table tr:last-child td {
      border-bottom: none;
    }

    .empty-td {
      text-align: center;
      padding: 20px;
      color: #926352;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <img src="logo.png" alt="Planners By Dounia Logo">
  </div>

  <div class="card" id="main-view">
    <h1 class="customer-name" id="name">Chargement...</h1>
    <p class="subtext">Votre Solde de Points Actuel</p>
    <div class="points" id="points">--</div>
    
    <div class="stages-container">
      <div class="track-line"></div>
      <div class="track-fill" id="track-fill"></div>

      <div class="stages-flex">
        <div class="stage-item" id="stage-1">
          <span class="stage-pts">15 Pts</span>
          <div class="stage-node"></div>
          <span class="stage-discount">10%</span>
        </div>
        <div class="stage-item" id="stage-2">
          <span class="stage-pts">25 Pts</span>
          <div class="stage-node"></div>
          <span class="stage-discount">20%</span>
        </div>
        <div class="stage-item" id="stage-3">
          <span class="stage-pts">35 Pts</span>
          <div class="stage-node"></div>
          <span class="stage-discount">30%</span>
        </div>
      </div>
    </div>

    <div class="nav-box" onclick="switchToHistoryView()">
      Cliquez pour s'avoir plus &rarr;
    </div>
  </div>

  <div class="card history-card" id="history-view" style="display: none;">
    <button class="back-btn" onclick="switchToMainView()">&larr; Retour</button>
    <h2 class="customer-name" style="font-size: 2.2rem;">Historique d'Achats</h2>
    <p class="subtext" id="history-customer-name">Chargement...</p>

    <div class="table-responsive">
      <table class="purchases-table">
        <thead>
          <tr>
            <th>Description</th>
            <th>Prix</th>
            <th>Date</th>
            <th>Points</th>
            <th>Solde</th>
          </tr>
        </thead>
        <tbody id="purchases-list">
          <tr>
            <td colspan="5" class="empty-td">Chargement des données...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qiycykcavkrecxgzrhmt.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpeWN5a2NhdmtyZWN4Z3pyaG10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMjE3NjUsImV4cCI6MjEwMzc5Nzc2NX0.NHfzCnn60BFGBn0_wyUHQG4fnfGX4PPWHcgxcHozF6s';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentCustomerId = null;

    async function fetchCustomerData() {
      const urlParams = new URLSearchParams(window.location.search);
      currentCustomerId = urlParams.get('id');

      if (!currentCustomerId) {
        document.getElementById('name').innerText = "Carte Invalide";
        return;
      }

      // Exact query matching table "Clients" and column "Client_ID"
      const { data, error } = await supabaseClient
        .from('Clients')
        .select('*')
        .eq('Client_ID', currentCustomerId)
        .single();

      if (error || !data) {
        console.error("Supabase Error:", error);
        document.getElementById('name').innerText = "Carte Non Trouvée";
        document.getElementById('history-customer-name').innerText = "Client non trouvé";
      } else {
        const clientName = data['Client Fullname'] || "Client";
        const rawPoints = data['Current Points'] || "0";
        const pts = parseFloat(rawPoints);

        document.getElementById('name').innerText = clientName;
        document.getElementById('history-customer-name').innerText = clientName;
        document.getElementById('points').innerText = pts % 1 === 0 ? pts.toFixed(0) : pts.toFixed(1);

        // Reset stage states
        document.getElementById('stage-1').classList.remove('active');
        document.getElementById('stage-2').classList.remove('active');
        document.getElementById('stage-3').classList.remove('active');

        if (pts >= 15) document.getElementById('stage-1').classList.add('active');
        if (pts >= 25) document.getElementById('stage-2').classList.add('active');
        if (pts >= 35) document.getElementById('stage-3').classList.add('active');

        let fillWidth = 0;
        if (pts >= 35) {
          fillWidth = 70;
        } else if (pts >= 15) {
          fillWidth = ((pts - 15) / (35 - 15)) * 70;
        }
        document.getElementById('track-fill').style.width = fillWidth + '%';
      }
    }

    async function fetchPurchases() {
      if (!currentCustomerId) return;

      const listContainer = document.getElementById('purchases-list');
      
      const { data, error } = await supabaseClient
        .from('Purchases')
        .select('*')
        .eq('Client_ID', currentCustomerId);

      if (error || !data || data.length === 0) {
        listContainer.innerHTML = '<tr><td colspan="5" class="empty-td">Aucun achat trouvé.</td></tr>';
        return;
      }

      listContainer.innerHTML = '';
      data.forEach(item => {
        const desc = item['Purchase Description'] || '-';
        const price = item['Price'] || '-';
        const date = item['Date'] || '-';
        const ptsChange = item['Points_Change'] || '-';
        const currPts = item['Current Points'] || '-';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${desc}</td>
          <td>${price}</td>
          <td>${date}</td>
          <td>${ptsChange}</td>
          <td>${currPts}</td>
        `;
        listContainer.appendChild(tr);
      });
    }

    function switchToHistoryView() {
      document.getElementById('main-view').style.display = 'none';
      document.getElementById('history-view').style.display = 'block';
      fetchPurchases();
    }

    function switchToMainView() {
      document.getElementById('history-view').style.display = 'none';
      document.getElementById('main-view').style.display = 'block';
    }

    fetchCustomerData();
  </script>
</body>
</html>
